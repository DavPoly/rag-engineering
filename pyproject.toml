[project]
name = "rag-engineering"
version = "0.1.0"
description = "Policy Q&A service with cited answers"
authors = [
    { name = "David Pretty", email = "david.pretty@polymtl.ca" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.2",
    "numpy>=1.26",
    "openai>=1.54",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_answer_service"]